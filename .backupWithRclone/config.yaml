# yaml-language-server: $schema=https://raw.githubusercontent.com/lxma/backupWithRclone/refs/heads/main/config-schema-v1.json
rclone_destination_prefix: "wtf:backup"
dir_size_factor: 1
dirs:
  - source_dir: "./testdirs/unchanged_path"
  - source_dir: "./testdirs/changed_path_direct"
  - source_dir: "./testdirs/changed_path_indirect"
  - source_dir: "./testdirs/changed_subpaths"
