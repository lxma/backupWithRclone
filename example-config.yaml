# yaml-language-server: $schema=https://raw.githubusercontent.com/lxma/backupWithRclone/refs/heads/main/config-schema-v1.json
exclude_dirs: [.git, .venv, .@eaDir, .vscode]
exclude_files: [.github]
rclone_destination_prefix: pcloud:backup
dir_size_factor: 200
# target_dir can be specified - it defaults to the basename of the source directory.
# in the example below the resulting target destinations will be (considering the
# rclone_destination_prefix pcloud:backup):
#   ~/Pictures              -> pcloud:backup/Pictures
#   ~/Texts/Important       -> pcloud:backup/Important_Texts
#   ~/Development/Projects  -> pcloud:backup/Projects
dirs:
  - source_dir: ~/Pictures
  - source_dir: ~/Texts/Important
    target_dir: Important_Texts
    excluded_files: ["*.aux", "*.logger"]
    excluded_dirs: [.github]
    extra_rclone_params: ["--links"]
  - source_dir: ~/Development/Projects
